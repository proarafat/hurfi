<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" fill="none" role="img" aria-labelledby="growthTitle growthDesc">
  <title id="growthTitle">Hurfi connects manufacturers to global buyers</title>
  <desc id="growthDesc">A globe surrounded by Website, SEO, LinkedIn, Google, Alibaba, Made in China, Email Marketing, and Analytics, with a flow from Manufacturer through Hurfi to Global Buyers.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#0076F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0076F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="80" y1="80" x2="480" y2="480">
      <stop offset="0%" stop-color="#0076F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a2a55" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <circle cx="280" cy="250" r="210" fill="url(#glow)"/>
  <circle cx="280" cy="250" r="118" stroke="url(#orbit)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.7"/>
  <circle cx="280" cy="250" r="168" stroke="#0076F7" stroke-width="1" opacity="0.2"/>

  <!-- Connection lines from center to nodes -->
  <g stroke="#0076F7" stroke-opacity="0.28" stroke-width="1.5">
    <line x1="280" y1="250" x2="280" y2="78"/>
    <line x1="280" y1="250" x2="430" y2="110"/>
    <line x1="280" y1="250" x2="478" y2="220"/>
    <line x1="280" y1="250" x2="450" y2="340"/>
    <line x1="280" y1="250" x2="280" y2="420"/>
    <line x1="280" y1="250" x2="110" y2="340"/>
    <line x1="280" y1="250" x2="82" y2="220"/>
    <line x1="280" y1="250" x2="130" y2="110"/>
  </g>

  <!-- Globe -->
  <circle cx="280" cy="250" r="64" fill="#041428"/>
  <circle cx="280" cy="250" r="64" stroke="#0076F7" stroke-width="2.5"/>
  <ellipse cx="280" cy="250" rx="28" ry="64" stroke="#5aa4ff" stroke-width="1.2" opacity="0.7"/>
  <path d="M216 250h128M230 210h100M230 290h100" stroke="#5aa4ff" stroke-width="1.2" opacity="0.65"/>
  <path d="M248 198c18 22 46 22 64 0M248 302c18-22 46-22 64 0" stroke="#7eb6ff" stroke-width="1.1" opacity="0.55"/>
  <text x="280" y="256" text-anchor="middle" fill="#fff" font-family="Sora, system-ui, sans-serif" font-size="13" font-weight="700">Hurfi</text>

  <!-- Nodes -->
  <g font-family="Sora, system-ui, sans-serif" font-size="11" font-weight="600">
    <g transform="translate(280 78)">
      <rect x="-46" y="-16" width="92" height="32" rx="16" fill="#fff" stroke="#0076F7" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#0a2a55">Website</text>
    </g>
    <g transform="translate(430 110)">
      <rect x="-32" y="-16" width="64" height="32" rx="16" fill="#fff" stroke="#0076F7" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#0a2a55">SEO</text>
    </g>
    <g transform="translate(478 220)">
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#fff" stroke="#0076F7" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#0a2a55">LinkedIn</text>
    </g>
    <g transform="translate(450 340)">
      <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#fff" stroke="#0076F7" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#0a2a55">Google</text>
    </g>
    <g transform="translate(280 420)">
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#fff" stroke="#0076F7" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#0a2a55">Alibaba</text>
    </g>
    <g transform="translate(110 340)">
      <rect x="-58" y="-16" width="116" height="32" rx="16" fill="#fff" stroke="#0076F7" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#0a2a55">Made in China</text>
    </g>
    <g transform="translate(82 220)">
      <rect x="-58" y="-16" width="116" height="32" rx="16" fill="#fff" stroke="#0076F7" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#0a2a55">Email Marketing</text>
    </g>
    <g transform="translate(130 110)">
      <rect x="-46" y="-16" width="92" height="32" rx="16" fill="#fff" stroke="#0076F7" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#0a2a55">Analytics</text>
    </g>
  </g>

  <!-- Flow: Manufacturer ’ Hurfi ’ Global Buyers -->
  <g font-family="Sora, system-ui, sans-serif">
    <rect x="48" y="488" width="120" height="36" rx="8" fill="#0a2a55"/>
    <text x="108" y="511" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Manufacturer</text>

    <path d="M178 506h48" stroke="#0076F7" stroke-width="2.5" marker-end="url(#arrow)"/>
    <polygon points="226,501 236,506 226,511" fill="#0076F7"/>

    <rect x="240" y="488" width="80" height="36" rx="8" fill="#0076F7"/>
    <text x="280" y="511" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Hurfi</text>

    <path d="M330 506h48" stroke="#0076F7" stroke-width="2.5"/>
    <polygon points="378,501 388,506 378,511" fill="#0076F7"/>

    <rect x="392" y="488" width="120" height="36" rx="8" fill="#041428"/>
    <text x="452" y="511" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Global Buyers</text>
  </g>
</svg>
