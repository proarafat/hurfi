# Chinese-first static site. Do not run npm run build: patch-pages rewrites the live pages.
[build]
  # 1. zh_mirror.mjs refreshes the Chinese twins (zh/) from the English source pages and the dictionary.
  # 2. scripts/site/build.mjs assembles dist/: Chinese at /, English at /en/, shared content from
  #    scripts/site/config.mjs, hreflang, sitemap, llms.txt. If either step fails, the deploy fails and
  #    the previous version stays live.
  command = "node scripts/hurfi-pages/zh_mirror.mjs && node scripts/site/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  GIT_LFS_ENABLED = "true"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/appointment"
  to = "/book-consultation/"
  status = 301

[[redirects]]
  from = "/book"
  to = "/book-consultation/"
  status = 301

[[redirects]]
  from = "/case-studies"
  to = "/projects/"
  status = 301

[[redirects]]
  from = "/case-studies/"
  to = "/projects/"
  status = 301

[[redirects]]
  from = "https://www.hurfi.com/*"
  to = "https://hurfi.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

# Edge function source (netlify/edge-functions/) sits in the publish dir; Netlify deploys it, nobody fetches it.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=15552000; includeSubDomains"
    Cache-Control = "public, max-age=0, must-revalidate, no-transform"
    CDN-Cache-Control = "public, max-age=120"
    Cloudflare-CDN-Cache-Control = "public, max-age=120"
    Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    CDN-Cache-Control = "public, max-age=31536000, immutable"
    Cloudflare-CDN-Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, durable, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    CDN-Cache-Control = "public, max-age=31536000, immutable"
    Cloudflare-CDN-Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, durable, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
    CDN-Cache-Control = "public, max-age=2592000"
    Cloudflare-CDN-Cache-Control = "public, max-age=2592000"
    Netlify-CDN-Cache-Control = "public, durable, max-age=2592000"

[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
    CDN-Cache-Control = "public, max-age=2592000"
    Cloudflare-CDN-Cache-Control = "public, max-age=2592000"
    Netlify-CDN-Cache-Control = "public, durable, max-age=2592000"

[[headers]]
  for = "/assets/lottie/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    CDN-Cache-Control = "public, max-age=31536000, immutable"
    Cloudflare-CDN-Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, durable, max-age=31536000, immutable"

[[headers]]
  for = "/assets/team/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
    CDN-Cache-Control = "public, max-age=2592000"
    Cloudflare-CDN-Cache-Control = "public, max-age=2592000"
    Netlify-CDN-Cache-Control = "public, durable, max-age=2592000"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/ai.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
