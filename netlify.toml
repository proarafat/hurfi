# Netlify — build regenerates SEO/AEO/GEO files from data/site.config.json
[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Pretty URLs already work with folder/index.html
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/appointment"
  to = "/book-consultation/"
  status = 301

[[redirects]]
  from = "/book"
  to = "/book-consultation/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
