# Daily production build so the Baidu push plugin (netlify/plugins/baidu-push) can send the next batch of
# queued Chinese URLs within Baidu's daily quota. The plugin only sends new, changed or not-yet-accepted
# pages, so a day with nothing queued submits nothing.
#
# Inactive until the repository secret NETLIFY_BUILD_HOOK is set (Netlify: Site configuration → Build &
# deploy → Build hooks → Add build hook, branch "main"; GitHub: Settings → Secrets and variables → Actions).
# The hook URL is never printed.
name: Daily Baidu push

on:
  schedule:
    - cron: "30 1 * * *" # 09:30 Beijing time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Netlify production build
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "NETLIFY_BUILD_HOOK is not set; nothing to do."
            exit 0
          fi
          curl -fsS -X POST -d '{}' "$HOOK?trigger_title=Daily%20Baidu%20push" > /dev/null
          echo "Production build triggered."
