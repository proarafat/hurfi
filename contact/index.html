<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Hurfi</title>
  <meta name="description" content="Contact Hurfi — B2B growth partner for Chinese manufacturers, suppliers, and exporters.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css?v=20260724p">
  <meta name="theme-color" content="#0076F7">
  <link rel="icon" href="/assets/img/hurfi-icon.svg" type="image/svg+xml">
</head>
<body data-page="contact">
                                                                                    <header class="site-header">
    <div class="container container-nav header-inner">
      <a class="logo" href="/" aria-label="Hurfi home"></a>
      <nav id="site-nav" class="site-nav" aria-label="Main" data-site-nav></nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Contact Us</h1>
        <p class="lead">Talk to Hurfi about growing your Chinese manufacturing, supplier, or B2B brand online.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <h2>Business Inquiry</h2>
        <p>Email: <a href="mailto:yasir@hurfi.com">yasir@hurfi.com</a></p>
        <p class="note">WhatsApp number can be added here later.</p>

        <form action="/thank-you/" class="form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
          <input type="hidden" name="form-name" value="contact">
          <p style="display:none">
            <label>Don’t fill this out: <input name="bot-field"></label>
          </p>
          <label>Name
            <input type="text" name="name" required>
          </label>
          <label>Company Name
            <input type="text" name="company" required>
          </label>
          <label>Industry
            <input type="text" name="industry" placeholder="e.g. Chinese manufacturing">
          </label>
          <label>Message
            <textarea name="message" required></textarea>
          </label>
          <button class="btn" type="submit">Send Inquiry</button>
        </form>

        <div class="cta-row">
          <a class="btn btn-outline" href="../book-consultation/">Book a Consultation</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> Hurfi</p>
      <ul class="footer-links">
        <li><a href="./">Contact</a></li>
        <li><a href="../book-consultation/">Book a Consultation</a></li>
      </ul>
    </div>
  </footer>
  <script src="/assets/js/site-data.js?v=20260724p"></script>
  <script src="/assets/js/schema-data.js?v=20260724p"></script>
  <script src="/assets/js/site.js?v=20260724p"></script>
</body>
</html>
